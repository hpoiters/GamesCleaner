name: Build RC2

on:
  workflow_dispatch:
  push:
    paths:
      - "reference/source-parts/**"
      - "docs/**"
      - ".github/workflows/build-publication-candidate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reconstruct and verify Dutch source
        shell: pwsh
        run: |
          $parts = Get-ChildItem reference/source-parts/nl-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("GamesCleaner_NL_source_exact.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "GamesCleaner_NL_source_exact.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "41f323936105b916d03c461e555b322d444da44079dcfe25bfe0d17136920165") { throw "Dutch source checksum mismatch: $sha" }
          New-Item -ItemType Directory -Force -Path build-nl | Out-Null
          Expand-Archive -Path GamesCleaner_NL_source_exact.zip -DestinationPath build-nl -Force

      - name: Create English source from verified Dutch source
        shell: pwsh
        run: |
          $parts = Get-ChildItem reference/source-parts/enpatch-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("nl_to_en.patch.gz", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "nl_to_en.patch.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "9e0162beff9c1b26a732554e4a0ee4ca2e2b72e37d75716cb7af3cf896a80d20") { throw "English translation patch checksum mismatch: $sha" }
          cmd /c "gzip -d -c nl_to_en.patch.gz > nl_to_en.patch"
          Copy-Item build-nl\src build-en -Recurse
          git apply --unsafe-paths -p1 --directory=build-en nl_to_en.patch
          if ($LASTEXITCODE -ne 0) { throw "English translation patch failed" }

      - name: Apply RC2 layout-only adjustment
        shell: pwsh
        run: |
          $files = @(
            "build-nl/src/GamesCleaner/MainForm.cs",
            "build-en/GamesCleaner/MainForm.cs"
          )
          foreach ($file in $files) {
            $s = Get-Content $file -Raw
            $isEn = $file -like "*build-en*"
            $outputLabel = if ($isEn) { "Output folder:" } else { "Uitvoermap:" }
            $chooseText = if ($isEn) { "Choose output folder…" } else { "Uitvoermap kiezen…" }
            $defaultText = if ($isEn) { "Default" } else { "Standaard" }
            $progressLabel = if ($isEn) { "Progress:" } else { "Voortgang:" }
            $readyText = if ($isEn) { "Ready." } else { "Gereed." }
            $percentText = if ($isEn) { "0.0%" } else { "0,0%" }
            $countsText = if ($isEn) { "Games: 0   StrongGames: 0   Rejected: 0" } else { "Partijen: 0   StrongGames: 0   Afgekeurd: 0" }

            $newOutput = @'
		Panel groupBox2 = new Panel
		{
			Dock = DockStyle.Top,
			AutoSize = true,
			Padding = new Padding(3),
			Margin = new Padding(0, 1, 0, 0)
		};
		TableLayoutPanel tableLayoutPanel4 = new TableLayoutPanel
		{
			Dock = DockStyle.Fill,
			AutoSize = true,
			ColumnCount = 4,
			RowCount = 1
		};
		tableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.AutoSize));
		tableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 100f));
		tableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.AutoSize));
		tableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.AutoSize));
		tableLayoutPanel4.RowStyles.Add(new RowStyle(SizeType.AutoSize));
		tableLayoutPanel4.Controls.Add(MakeLabel("__OUTPUT_LABEL__"), 0, 0);
		_outputPathBox.ReadOnly = true;
		_outputPathBox.Dock = DockStyle.Fill;
		_outputPathBox.Text = _outputRootDirectory;
		_outputPathBox.Margin = new Padding(6, 3, 3, 3);
		tableLayoutPanel4.Controls.Add(_outputPathBox, 1, 0);
		_defaultOutputButton.Text = "__DEFAULT_TEXT__";
		_defaultOutputButton.AutoSize = true;
		_defaultOutputButton.Margin = new Padding(8, 3, 0, 3);
		_defaultOutputButton.Click += delegate
		{
			ResetOutputDirectory();
		};
		tableLayoutPanel4.Controls.Add(_defaultOutputButton, 2, 0);
		_chooseOutputButton.Text = "__CHOOSE_TEXT__";
		_chooseOutputButton.AutoSize = true;
		_chooseOutputButton.Margin = new Padding(8, 3, 0, 3);
		_chooseOutputButton.Click += delegate
		{
			ChooseOutputDirectory();
		};
		tableLayoutPanel4.Controls.Add(_chooseOutputButton, 3, 0);
		groupBox2.Controls.Add(tableLayoutPanel4);
		tableLayoutPanel.Controls.Add(groupBox2, 0, 4);
'@
            $newOutput = $newOutput.Replace("__OUTPUT_LABEL__", $outputLabel).Replace("__DEFAULT_TEXT__", $defaultText).Replace("__CHOOSE_TEXT__", $chooseText)
            $outputPattern = '(?s)\t\tGroupBox groupBox2 = new GroupBox.*?\t\ttableLayoutPanel\.Controls\.Add\(groupBox2, 0, 4\);'
            $rxOutput = [regex]::new($outputPattern)
            $s2 = $rxOutput.Replace($s, $newOutput, 1)
            if ($s2 -eq $s) { throw "RC2 output layout replacement failed for $file" }
            $s = $s2

            $newProgress = @'
		Panel groupBox3 = new Panel
		{
			Dock = DockStyle.Top,
			AutoSize = true,
			Padding = new Padding(3),
			Margin = new Padding(0, 1, 0, 1)
		};
		TableLayoutPanel tableLayoutPanel5 = new TableLayoutPanel
		{
			Dock = DockStyle.Fill,
			AutoSize = true,
			ColumnCount = 2,
			RowCount = 4
		};
		tableLayoutPanel5.ColumnStyles.Add(new ColumnStyle(SizeType.AutoSize));
		tableLayoutPanel5.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 100f));
		tableLayoutPanel5.Controls.Add(MakeLabel("__PROGRESS_LABEL__"), 0, 0);
		_currentFile.AutoEllipsis = true;
		_currentFile.Dock = DockStyle.Fill;
		_currentFile.Text = "__READY_TEXT__";
		tableLayoutPanel5.Controls.Add(_currentFile, 1, 0);
		_progressBar.Dock = DockStyle.Top;
		_progressBar.Minimum = 0;
		_progressBar.Maximum = 1000;
		_progressBar.Height = 15;
		_progressBar.Margin = new Padding(0, 1, 0, 1);
		tableLayoutPanel5.Controls.Add(_progressBar, 0, 1);
		tableLayoutPanel5.SetColumnSpan(_progressBar, 2);
		_progressText.AutoSize = true;
		_progressText.Text = "__PERCENT_TEXT__";
		tableLayoutPanel5.Controls.Add(_progressText, 0, 2);
		tableLayoutPanel5.SetColumnSpan(_progressText, 2);
		_counts.AutoSize = true;
		_counts.Text = "__COUNTS_TEXT__";
		tableLayoutPanel5.Controls.Add(_counts, 0, 3);
		tableLayoutPanel5.SetColumnSpan(_counts, 2);
		groupBox3.Controls.Add(tableLayoutPanel5);
		tableLayoutPanel.Controls.Add(groupBox3, 0, 5);
'@
            $newProgress = $newProgress.Replace("__PROGRESS_LABEL__", $progressLabel).Replace("__READY_TEXT__", $readyText).Replace("__PERCENT_TEXT__", $percentText).Replace("__COUNTS_TEXT__", $countsText)
            $progressPattern = '(?s)\t\tGroupBox groupBox3 = new GroupBox.*?\t\ttableLayoutPanel\.Controls\.Add\(groupBox3, 0, 5\);'
            $rxProgress = [regex]::new($progressPattern)
            $s2 = $rxProgress.Replace($s, $newProgress, 1)
            if ($s2 -eq $s) { throw "RC2 progress layout replacement failed for $file" }
            $s = $s2

            if ($s -notmatch 'Panel groupBox2 = new Panel' -or
                $s -notmatch 'Controls\.Add\(_defaultOutputButton, 2, 0\)' -or
                $s -notmatch 'Controls\.Add\(_chooseOutputButton, 3, 0\)' -or
                $s -notmatch 'Panel groupBox3 = new Panel' -or
                $s -notmatch 'Controls\.Add\(_currentFile, 1, 0\)') {
              throw "RC2 layout verification failed for $file"
            }
            Set-Content -Path $file -Value $s -Encoding utf8 -NoNewline
          }

      - name: Run Dutch self-test
        shell: pwsh
        run: |
          dotnet run --project build-nl/src/GamesCleaner.csproj -c Release -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "Dutch GamesCleaner self-test failed" }

      - name: Run English self-test
        shell: pwsh
        run: |
          dotnet run --project build-en/GamesCleaner.csproj -c Release -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "English GamesCleaner self-test failed" }

      - name: Publish Dutch Windows x64
        shell: pwsh
        run: |
          dotnet publish build-nl/src/GamesCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish-nl
          if ($LASTEXITCODE -ne 0) { throw "Dutch dotnet publish failed" }

      - name: Publish English Windows x64
        shell: pwsh
        run: |
          dotnet publish build-en/GamesCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish-en
          if ($LASTEXITCODE -ne 0) { throw "English dotnet publish failed" }

      - name: Prepare RC2 packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-nl | Out-Null
          New-Item -ItemType Directory -Force -Path package-en | Out-Null
          Copy-Item publish-nl\GamesCleaner.exe "package-nl\!GamesCleaner.exe"
          Copy-Item docs\HANDLEIDING_NL.txt "package-nl\HANDLEIDING.txt"
          Copy-Item publish-en\GamesCleaner.exe "package-en\!GamesCleaner.exe"
          Copy-Item docs\USER_GUIDE_EN.txt "package-en\USER_GUIDE.txt"
          Compress-Archive -Path package-nl\* -DestinationPath GamesCleaner_NL_RC2.zip -Force
          Compress-Archive -Path package-en\* -DestinationPath GamesCleaner_EN_RC2.zip -Force
          Compress-Archive -Path build-nl\src\* -DestinationPath GamesCleaner_NL_RC2_SOURCE.zip -Force
          Compress-Archive -Path build-en\* -DestinationPath GamesCleaner_EN_RC2_SOURCE.zip -Force

      - name: Upload Dutch RC2
        uses: actions/upload-artifact@v4
        with:
          name: GamesCleaner_NL_RC2
          path: GamesCleaner_NL_RC2.zip
          if-no-files-found: error

      - name: Upload English RC2
        uses: actions/upload-artifact@v4
        with:
          name: GamesCleaner_EN_RC2
          path: GamesCleaner_EN_RC2.zip
          if-no-files-found: error

      - name: Upload matching RC2 source
        uses: actions/upload-artifact@v4
        with:
          name: GamesCleaner_SOURCE_RC2
          path: |
            GamesCleaner_NL_RC2_SOURCE.zip
            GamesCleaner_EN_RC2_SOURCE.zip
          if-no-files-found: error
