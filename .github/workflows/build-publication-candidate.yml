name: Build RC3

on:
  workflow_dispatch:
  push:
    paths:
      - "reference/source-parts/**"
      - "docs/**"
      - ".github/workflows/build-publication-candidate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reconstruct and verify Dutch source
        shell: pwsh
        run: |
          $parts = Get-ChildItem reference/source-parts/nl-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("GamesCleaner_NL_source_exact.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "GamesCleaner_NL_source_exact.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "41f323936105b916d03c461e555b322d444da44079dcfe25bfe0d17136920165") { throw "Dutch source checksum mismatch: $sha" }
          New-Item -ItemType Directory -Force -Path build-nl | Out-Null
          Expand-Archive -Path GamesCleaner_NL_source_exact.zip -DestinationPath build-nl -Force

      - name: Create English source from verified Dutch source
        shell: pwsh
        run: |
          $parts = Get-ChildItem reference/source-parts/enpatch-*.b64 | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("nl_to_en.patch.gz", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "nl_to_en.patch.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "9e0162beff9c1b26a732554e4a0ee4ca2e2b72e37d75716cb7af3cf896a80d20") { throw "English translation patch checksum mismatch: $sha" }
          cmd /c "gzip -d -c nl_to_en.patch.gz > nl_to_en.patch"
          Copy-Item build-nl\src build-en -Recurse
          git apply --unsafe-paths -p1 --directory=build-en nl_to_en.patch
          if ($LASTEXITCODE -ne 0) { throw "English translation patch failed" }

      - name: Apply RC3 layout-only adjustment
        shell: pwsh
        run: |
          $files = @(
            "build-nl/src/GamesCleaner/MainForm.cs",
            "build-en/GamesCleaner/MainForm.cs"
          )
          foreach ($file in $files) {
            $s = Get-Content $file -Raw
            $before = $s

            # Remove only the decorative Output/Uitvoer group box.
            $s = [regex]::Replace($s, '(?s)\t\tGroupBox groupBox2 = new GroupBox\r?\n\t\t\{\r?\n.*?\t\t\};\r?\n(?=\t\tTableLayoutPanel tableLayoutPanel4)', '', 1)

            # Put output label, path, Default and folder chooser on one row.
            $replacement = '$1' + "`t`t`tColumnCount = 4,`r`n`t`t`tRowCount = 1,`r`n`t`t`tMargin = new Padding(0, 1, 0, 0)"
            $s = [regex]::Replace($s, '(\t\tTableLayoutPanel tableLayoutPanel4 = new TableLayoutPanel\r?\n\t\t\{\r?\n\t\t\tDock = DockStyle\.Fill,\r?\n\t\t\tAutoSize = true,\r?\n)\t\t\tColumnCount = 2,\r?\n\t\t\tRowCount = 2', $replacement, 1)

            $s = [regex]::Replace($s, '\t\ttableLayoutPanel4\.ColumnStyles\.Add\(new ColumnStyle\(SizeType\.AutoSize\)\);\r?\n\t\ttableLayoutPanel4\.ColumnStyles\.Add\(new ColumnStyle\(SizeType\.Percent, 100f\)\);\r?\n\t\ttableLayoutPanel4\.RowStyles\.Add\(new RowStyle\(SizeType\.AutoSize\)\);\r?\n\t\ttableLayoutPanel4\.RowStyles\.Add\(new RowStyle\(SizeType\.AutoSize\)\);', "`t`ttableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.AutoSize));`r`n`t`ttableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 100f));`r`n`t`ttableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.AutoSize));`r`n`t`ttableLayoutPanel4.ColumnStyles.Add(new ColumnStyle(SizeType.AutoSize));`r`n`t`ttableLayoutPanel4.RowStyles.Add(new RowStyle(SizeType.AutoSize));", 1)

            $s = [regex]::Replace($s, '\t\tFlowLayoutPanel flowLayoutPanel5 = MakeWrapFlow\(\);\r?\n\t\tflowLayoutPanel5\.FlowDirection = FlowDirection\.RightToLeft;\r?\n\t\tflowLayoutPanel5\.Dock = DockStyle\.Top;\r?\n', '', 1)
            $s = $s.Replace("`t`tflowLayoutPanel5.Controls.Add(_chooseOutputButton);", "`t`ttableLayoutPanel4.Controls.Add(_chooseOutputButton, 3, 0);")
            $s = $s.Replace("`t`tflowLayoutPanel5.Controls.Add(_defaultOutputButton);", "`t`ttableLayoutPanel4.Controls.Add(_defaultOutputButton, 2, 0);")

            $s = [regex]::Replace($s, '\t\ttableLayoutPanel4\.Controls\.Add\(flowLayoutPanel5, 0, 1\);\r?\n\t\ttableLayoutPanel4\.SetColumnSpan\(flowLayoutPanel5, 2\);\r?\n\t\tgroupBox2\.Controls\.Add\(tableLayoutPanel4\);\r?\n\t\ttableLayoutPanel\.Controls\.Add\(groupBox2, 0, 4\);', "`t`ttableLayoutPanel.Controls.Add(tableLayoutPanel4, 0, 4);", 1)

            # Remove only the decorative Progress/Voortgang group box.
            $s = [regex]::Replace($s, '(?s)\t\tGroupBox groupBox3 = new GroupBox\r?\n\t\t\{\r?\n.*?\t\t\};\r?\n(?=\t\tTableLayoutPanel tableLayoutPanel5)', '', 1)

            # RC3: use one non-wrapping header row, so Progress/Voortgang and the live status
            # are guaranteed to stay beside each other.
            $progressCaption = if ($file -like "*build-en*") { "Progress:" } else { "Voortgang:" }
            $headerCode = "`t`tFlowLayoutPanel progressHeader = MakeWrapFlow();`r`n" +
                          "`t`tprogressHeader.WrapContents = false;`r`n" +
                          "`t`tprogressHeader.AutoSize = true;`r`n" +
                          "`t`tprogressHeader.Dock = DockStyle.Fill;`r`n" +
                          "`t`tprogressHeader.Margin = Padding.Empty;`r`n" +
                          "`t`tprogressHeader.Controls.Add(MakeLabel(`"$progressCaption`"));`r`n" +
                          "`t`t_currentFile.Margin = new Padding(3, 5, 3, 2);`r`n" +
                          "`t`tprogressHeader.Controls.Add(_currentFile);`r`n"
            $s = $s.Replace("`t`t_currentFile.AutoEllipsis = true;", $headerCode + "`t`t_currentFile.AutoEllipsis = true;")
            $s = $s.Replace("`t`ttableLayoutPanel5.Controls.Add(_currentFile, 0, 0);", "`t`ttableLayoutPanel5.Controls.Add(progressHeader, 0, 0);")
            $s = [regex]::Replace($s, '\t\tgroupBox3\.Controls\.Add\(tableLayoutPanel5\);\r?\n\t\ttableLayoutPanel\.Controls\.Add\(groupBox3, 0, 5\);', "`t`ttableLayoutPanel.Controls.Add(tableLayoutPanel5, 0, 5);", 1)

            if ($s -eq $before) { throw "RC3 layout adjustment did not change $file" }
            if ($s -match 'groupBox2' -or $s -match 'flowLayoutPanel5' -or $s -match 'groupBox3') { throw "RC3 obsolete layout wrapper remains in $file" }
            if ($s -notmatch 'ColumnCount = 4' -or $s -notmatch 'Controls\.Add\(_defaultOutputButton, 2, 0\)' -or $s -notmatch 'Controls\.Add\(_chooseOutputButton, 3, 0\)' -or $s -notmatch 'progressHeader\.WrapContents = false' -or $s -notmatch 'Controls\.Add\(progressHeader, 0, 0\)') { throw "RC3 layout verification failed for $file" }
            Set-Content -Path $file -Value $s -Encoding utf8 -NoNewline
          }
      - name: Run Dutch self-test
        shell: pwsh
        run: |
          dotnet run --project build-nl/src/GamesCleaner.csproj -c Release -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "Dutch GamesCleaner self-test failed" }

      - name: Run English self-test
        shell: pwsh
        run: |
          dotnet run --project build-en/GamesCleaner.csproj -c Release -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "English GamesCleaner self-test failed" }

      - name: Publish Dutch Windows x64
        shell: pwsh
        run: |
          dotnet publish build-nl/src/GamesCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish-nl
          if ($LASTEXITCODE -ne 0) { throw "Dutch dotnet publish failed" }

      - name: Publish English Windows x64
        shell: pwsh
        run: |
          dotnet publish build-en/GamesCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish-en
          if ($LASTEXITCODE -ne 0) { throw "English dotnet publish failed" }

      - name: Prepare RC3 packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-nl | Out-Null
          New-Item -ItemType Directory -Force -Path package-en | Out-Null
          Copy-Item publish-nl\GamesCleaner.exe "package-nl\!GamesCleaner.exe"
          Copy-Item docs\HANDLEIDING_NL.txt "package-nl\HANDLEIDING.txt"
          Copy-Item publish-en\GamesCleaner.exe "package-en\!GamesCleaner.exe"
          Copy-Item docs\USER_GUIDE_EN.txt "package-en\USER_GUIDE.txt"
          Compress-Archive -Path package-nl\* -DestinationPath GamesCleaner_NL_RC3.zip -Force
          Compress-Archive -Path package-en\* -DestinationPath GamesCleaner_EN_RC3.zip -Force
          Compress-Archive -Path build-nl\src\* -DestinationPath GamesCleaner_NL_RC3_SOURCE.zip -Force
          Compress-Archive -Path build-en\* -DestinationPath GamesCleaner_EN_RC3_SOURCE.zip -Force

      - name: Upload Dutch RC3
        uses: actions/upload-artifact@v4
        with:
          name: GamesCleaner_NL_RC3
          path: GamesCleaner_NL_RC3.zip
          if-no-files-found: error

      - name: Upload English RC3
        uses: actions/upload-artifact@v4
        with:
          name: GamesCleaner_EN_RC3
          path: GamesCleaner_EN_RC3.zip
          if-no-files-found: error

      - name: Upload matching RC3 source
        uses: actions/upload-artifact@v4
        with:
          name: GamesCleaner_SOURCE_RC3
          path: |
            GamesCleaner_NL_RC3_SOURCE.zip
            GamesCleaner_EN_RC3_SOURCE.zip
          if-no-files-found: error
